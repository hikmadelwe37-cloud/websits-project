<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="Expense.css">
</head>
<body>

    <div class="container">
        <h2>Expense Tracker</h2>

        <!-- Balance & Summary Cards -->
        <div class="summary-card">
            <h3>Total Balance</h3>
            <h1 id="balance">$0.00</h1>
            <div class="income-expense">
                <div>
                    <h4>Income</h4>
                    <p id="total-income" class="income">$0.00</p>
                </div>
                <div>
                    <h4>Expense</h4>
                    <p id="total-expense" class="expense">$0.00</p>
                </div>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <form id="transaction-form">
            <h3>Add New Transaction</h3>
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="e.g., Salary, Groceries..." required>
            </div>
            <div class="form-group">
                <label for="amount">Amount (+ for income, - for expense)</label>
                <input type="number" id="amount" step="0.01" placeholder="e.g., 50 or -20" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category">
                    <option value="General">General</option>
                    <option value="Food">Food</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Income">Income</option>
                </select>
            </div>
            <button type="submit" class="btn">Add Transaction</button>
        </form>

        <!-- Filter Transactions -->
        <div class="filter-group">
            <label for="filter-category">Filter by Category:</label>
            <select id="filter-category">
                <option value="All">All</option>
                <option value="General">General</option>
                <option value="Food">Food</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Income">Income</option>
            </select>
        </div>

        <!-- Transaction History List -->
        <div class="history-section">
            <h3>History</h3>
            <ul id="transaction-list">
                <!-- Transactions will be injected dynamically via JS -->
            </ul>
        </div>
    </div>

    <script src="Expense.js"></script>
</body>
</html>
